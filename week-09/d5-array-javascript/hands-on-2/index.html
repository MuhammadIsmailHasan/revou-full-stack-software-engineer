<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sale Calculator</h1>

    <div class="stage">
        <h2>1. filter → in-stock & on-sale items</h2>
        <p id="step-filter">—</p>
    </div>
    <div class="stage">
        <h2>2. map → discounted prices</h2>
        <p id="step-map">—</p>
    </div>
    <div class="stage">
        <h2>3. reduce → total sale value</h2>
        <p id="step-reduce" class="total">—</p>
    </div>
    <div class="stage final">
        <h2>✅ Chained in one expression</h2>
        <p id="step-chain" class="total">—</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
