<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login - RevoShop</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <nav></nav>
  <h1>Login</h1>
  <p>Demo account: demo@revoshop.com / password123</p>
  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="you@example.com" data-testid="email-input">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" data-testid="password-input">
    <p><button type="submit" data-testid="login-submit">Sign in</button></p>
  </form>
  <div id="msg"></div>
  <script type="module">
    import { login } from "/app.js";
    document.querySelector("#form").onsubmit = (e) => {
      e.preventDefault();
      const email = document.querySelector("#email").value;
      const password = document.querySelector("#password").value;
      if (login(email, password)) {
        location.href = "/";
      } else {
        document.querySelector("#msg").innerHTML = `<p role="alert">Invalid email or password</p>`;
      }
    };
  </script>
</body>
</html>
