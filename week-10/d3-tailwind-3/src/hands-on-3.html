<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="stylesheet" href="./../dist/output.css" />
	</head>
	<body>
		<!-- ============================================================
        Hands-On 3: Rebuild the product-card grid — TAILWIND ONLY.
        Do NOT add anything to the CSS tab. Add utility classes here.
        ============================================================ -->
		<div class="min-h-screen bg-gray-100 p-8">
			<h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
				Our Products
			</h1>

			<!-- TODO 1: make this a centered 3-column grid with gaps (grid grid-cols-3 gap-6 max-w-5xl mx-auto) -->
			<div class="grid grid-cols-3 gap-6 max-w-5xl mx-auto">
				<!-- TODO 2: make each <article> a white rounded card with a shadow -->
				<article class="bg-white shadow-xl rounded-lg">
					<img
						class="w-full object-fill rounded-t-lg"
						src="https://placehold.co/400x200/2563eb/ffffff?text=Laptop"
						alt="Laptop"
					/>
					<div class="p-4">
						<h2 class="text-lg font-semibold text-gray-800">
							Laptop
						</h2>
						<p class="text-blue-600 font-bold mt-1">
							Rp 15.000.000
						</p>
						<button
							class="bg-green-800 hover:bg-green-600 p-2 mt-5 rounded-md text-white"
						>
							Buy now
						</button>
					</div>
				</article>

				<article class="bg-white shadow-lg rounded-lg">
					<img
						class="w-full object-cover rounded-t-lg"
						src="https://placehold.co/400x200/16a34a/ffffff?text=Mouse"
						alt="Mouse"
					/>
					<div class="p-4">
						<h2 class="text-lg font-semibold text-gray-800">
							Wireless Mouse
						</h2>
						<p class="text-blue-600 font-bold mt-1">Rp 250.000</p>
						<button
							class="bg-blue-800 p-2 mt-5 rounded-lg text-white"
						>
							Buy now
						</button>
					</div>
				</article>

				<article class="bg-white shadow-lg rounded-lg">
					<img
						class="w-full object-contain rounded-t-lg"
						src="https://placehold.co/400x200/db2777/ffffff?text=Keyboard"
						alt="Keyboard"
					/>
					<div class="p-4">
						<h2 class="text-lg font-semibold text-gray-800">
							Keyboard
						</h2>
						<p class="text-blue-600 font-bold mt-1">Rp 500.000</p>
						<button
							class="bg-yellow-500 p-2 mt-5 rounded-lg text-white"
						>
							Buy now
						</button>
					</div>
				</article>
			</div>
		</div>
	</body>
