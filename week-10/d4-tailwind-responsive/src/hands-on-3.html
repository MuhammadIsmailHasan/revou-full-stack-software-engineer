<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="stylesheet" href="../dist/output.css" />
	</head>
	<body>
		<!-- ============================================================
        Hands-On 3: Three reusable patterns — UTILITIES ONLY.
        1) responsive navbar  2) product card  3) alert/badge variants
        Leave the CSS tab empty.
        ============================================================ -->
		<div class="min-h-screen bg-gray-100">
			<!-- 1) NAVBAR — TODO: flex, stacked on mobile, row + justify-between on md+ -->
			<nav
				class="flex flex-col md:flex-row md:justify-between md:content-center bg-white shadow px-6 py-4"
			>
				<span class="text-xl font-bold text-blue-600">TokoTS</span>
				<div
					class="flex flex-col gap-4 md:flex md:flex-row md:mt-0 mt-2"
				>
					<a href="#" class="text-gray-600 hover:text-blue-600"
						>Home</a
					>
					<a href="#" class="text-gray-600 hover:text-blue-600"
						>Products</a
					>
					<a href="#" class="text-gray-600 hover:text-blue-600"
						>Cart</a
					>
				</div>
			</nav>

			<main class="p-8 space-y-8 max-w-md mx-auto">
				<!-- 2) PRODUCT CARD — TODO: white rounded shadowed card -->
				<article class="bg-white rounded-lg shadow-lg">
					<img
						class="w-full h-40 object-cover"
						src="https://placehold.co/400x200/2563eb/ffffff?text=Laptop"
						alt="Laptop"
					/>
					<div class="p-4">
						<!-- TODO: small green "In stock" badge pill -->
						<span
							class="bg-green-700 text-green-200 p-2 rounded-3xl"
							>In stock</span
						>
						<h2
							class="text-lg font-bold text-gray-900 truncate mt-2"
						>
							Laptop Pro 14-inch Ultra
						</h2>
						<p class="text-xl font-bold text-blue-600 mt-1">
							Rp 15.000.000
						</p>
						<!-- TODO: full-width blue button -->
						<button
							class="w-full bg-blue-600 rounded-lg text-white p-4 mt-3"
						>
							Add to cart
						</button>
					</div>
				</article>

				<!-- 3) ALERTS — TODO: same shape, three colour variants -->
				<div class="space-y-3">
					<div
						class="bg-white p-4 rounded-xl text-green-500 border border-green-800"
					>
						✅ Your order was placed successfully.
					</div>
					<div
						class="bg-white p-4 rounded-xl text-yellow-300 border border-yellow-300"
					>
						⚠️ Only 2 items left in stock.
					</div>
					<div
						class="bg-white p-4 rounded-xl text-red-700 border border-red-400"
					>
						⛔ Payment failed. Please try again.
					</div>
				</div>
			</main>
		</div>
	</body>
</html>
